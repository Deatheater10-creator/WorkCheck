services:
  - type: web
    name: workcheck
    runtime: python
    plan: free
    branch: master
    buildCommand: pip install -r requirements.txt
    startCommand: python -m streamlit run cloud_app.py --server.address 0.0.0.0 --server.port $PORT --server.headless true --browser.gatherUsageStats false
    healthCheckPath: /_stcore/health
